name: Security

# Runs on every PR + nightly so we catch newly-published CVEs in deps we
# already shipped. The CodeQL step covers JS/TS injection / prototype-pollution
# patterns that ESLint can't see; Semgrep adds OWASP / Next.js rule packs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm audit (production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: |
          # Fail the job on `high` or `critical`; surface `moderate` as a
          # warning. Scoped to production deps only — dev tools have their
          # own cadence and don't ship to customers.
          npm audit --omit=dev --audit-level=high

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v7
      # Use `semgrep scan` (not `semgrep ci`) because we don't have a
      # Semgrep Cloud account / SEMGREP_APP_TOKEN configured. `--error`
      # makes the job fail when any finding is reported.
      - run: semgrep scan --config=p/owasp-top-ten --config=p/typescript --config=p/nextjs --config=p/javascript --error

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: ["javascript-typescript"]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  secret-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
